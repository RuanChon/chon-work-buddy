name: Update daily hot news

on:
  schedule:
    # 避开 GitHub Actions 的整点高峰，并在 08:00 前后提供补偿重试。
    # UTC 23:30 / 23:50 / 00:10 = 北京时间 07:30 / 07:50 / 08:10。
    - cron: '30 23 * * *'
    - cron: '50 23 * * *'
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hot-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install scraper dependencies
        run: npm ci --omit=dev --prefix server --no-audit

      - name: Fetch People.cn and Qiushi headlines
        run: node server/fetch-hot-news.js
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Commit updated headlines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hot-news.json
          if git diff --cached --quiet; then
            echo "No headline changes"
            exit 0
          fi
          git commit -m "chore: update daily hot news"
          git pull --rebase origin main
          git push origin HEAD:main
